services:
  api:
    build: .
    image: sba-loan-risk-engine:local
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ENV: development
      DEBUG: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8501,http://127.0.0.1:8501,http://localhost:8000,http://127.0.0.1:8000}
      REDIS_URL: redis://redis:6379/0
      API_KEY: ${API_KEY:-local-compose-api-key}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-compose-jwt-secret-for-development}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
