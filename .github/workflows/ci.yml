name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint-test-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install test and lint dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Ruff lint
        run: python -m ruff check --config ruff.toml app src tests

      - name: Run tests with coverage
        run: python -m pytest -q --cov --cov-report=term-missing --cov-report=xml

      - name: Build Docker image
        run: docker compose build

      - name: Check API and Redis startup
        run: |
          docker compose up --wait --wait-timeout 180
          curl --fail --show-error http://127.0.0.1:8000/health

      - name: Stop Compose services
        if: always()
        run: docker compose down

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14
