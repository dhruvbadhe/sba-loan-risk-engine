target-version = "py310"
extend-exclude = ["notebooks", "venv"]

[lint]
select = ["E4", "E7", "E9", "F"]

# Existing lint debt is kept explicit while the upgrade plan defers cleanups.
# All other files use the rules above without exceptions.
[lint.per-file-ignores]
"app/api/routes_predict.py" = ["E402"]
"app/cache/redis_cache.py" = ["F841"]
"app/core/dependencies.py" = ["F401"]
"src/evaluate.py" = ["F401"]
